name: Weather Notifications

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: .github/scripts
        run: npm install

      - name: Run notifications
        working-directory: .github/scripts
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}
          PIRATE_WEATHER_KEY: ${{ secrets.PIRATE_WEATHER_KEY }}
        run: node notify.mjs

      - name: Report workflow status to Uptime Kuma
        if: ${{ always() }}
        env:
          UPTIME_KUMA_PUSH_URL: ${{ secrets.UPTIME_KUMA_PUSH_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$UPTIME_KUMA_PUSH_URL" ]; then
            echo "::warning::UPTIME_KUMA_PUSH_URL is not configured; skipping Uptime Kuma heartbeat."
            exit 0
          fi

          case "$JOB_STATUS" in
            success) STATUS="up" ;;
            *) STATUS="down" ;;
          esac

          # Kuma's copied URL includes default query parameters; replace them
          # so this heartbeat reports the real Actions result.
          PUSH_URL="${UPTIME_KUMA_PUSH_URL%%\?*}"
          RUN_MSG="Weather Notifications run ${GITHUB_RUN_NUMBER}: ${JOB_STATUS}"

          curl --fail --silent --show-error \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 2 \
            --retry-delay 2 \
            --get "$PUSH_URL" \
            --data-urlencode "status=$STATUS" \
            --data-urlencode "msg=$RUN_MSG" \
            --data-urlencode "ping="
